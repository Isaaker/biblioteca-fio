name: Generar y publicar catálogo
on:
  push:
    branches: [main]
    paths:
      - "data/indice_general.xlsx"
      - "data/digitalizados.json"
      - "build/**"
      - "site/**"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:
    inputs:
      allow_empty_catalog:
        description: "Permitir catálogo vacío (0 libros). Solo para el arranque inicial del sitio, sin Excel real todavía."
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Instalar dependencias Python
        run: pip install -r build/requirements.txt
      - name: Generar catalog.json + MARC21 + MARCXML (con salvaguarda anti-fuga)
        env:
          ALLOW_EMPTY_CATALOG: ${{ github.event.inputs.allow_empty_catalog == 'true' && '1' || '0' }}
        run: python build/generate_catalog.py
      - name: Preparar carpeta de publicación (dist/)
        run: |
          rm -rf dist
          mkdir -p dist
          cp -r site/. dist/
      - name: Comprobación final — el Excel maestro nunca debe acabar en dist/
        run: |
          if find dist -iname "*.xlsx" | grep -q .; then
            echo "ERROR: se ha encontrado un fichero .xlsx dentro de dist/. Abortando publicación."
            find dist -iname "*.xlsx"
            exit 1
          fi
          echo "OK: no hay ningún .xlsx en dist/."
      - name: Actualizar dist/ en el repositorio (para Cloudflare Pages)
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403
        with:
          commit_message: "chore: actualizar sitio construido (dist/)"
          file_pattern: "dist/**"
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Empaquetar dist/ para GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
