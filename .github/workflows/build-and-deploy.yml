name: Generar y publicar catálogo
on:
  push:
    branches: [main]
    paths:
      - "data/indice_general.xlsx"
      - "data/digitalizados.json"
      - "data/agradecimientos.json"
      - "data/blog/**"
      - "build/**"
      - "site/**"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:
    inputs:
      allow_empty_catalog:
        description: "Permitir catálogo vacío (0 libros). Solo para el arranque inicial del sitio, sin Excel real todavía."
        type: boolean
        default: false
  schedule:
    - cron: "15 0 1 * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  semgrep:
      runs-on: ubuntu-latest
      container:
        image: semgrep/semgrep
      steps:
        - name: Descargar el repositorio
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
  
        - name: Ejecutar Semgrep
          # "auto" descarga un conjunto de reglas ajustado automáticamente
          # al contenido del repo (Python, JavaScript...); no requiere
          # login ni token de Semgrep para uso público/gratuito. --error
          # hace que el workflow falle (en rojo) si encuentra algún
          # hallazgo, para que sea imposible pasarlo por alto.
          run: semgrep scan --config auto --error

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio (con todo el historial)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  build:
    runs-on: ubuntu-latest
    needs: [semgrep, gitleaks]
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Instalar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Instalar dependencias Python
        run: pip install -r build/requirements.txt
      - name: Generar catalog.json + MARC21 + MARCXML (con salvaguarda anti-fuga)
        env:
          ALLOW_EMPTY_CATALOG: ${{ github.event.inputs.allow_empty_catalog == 'true' && '1' || '0' }}
        run: python build/generate_catalog.py
      - name: Preparar carpeta de publicación (dist/)
        run: |
          rm -rf dist
          mkdir -p dist
          cp -r site/. dist/
      - name: Comprobación final — el Excel maestro nunca debe acabar en dist/
        run: |
          if find dist -iname "*.xlsx" | grep -q .; then
            echo "ERROR: se ha encontrado un fichero .xlsx dentro de dist/. Abortando publicación."
            find dist -iname "*.xlsx"
            exit 1
          fi
          echo "OK: no hay ningún .xlsx en dist/."
      - name: Actualizar dist/ en el repositorio (para Cloudflare Pages)
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
        with:
          commit_message: "chore: actualizar sitio construido (dist/)"
          file_pattern: "dist/**"
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Empaquetar dist/ para GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
